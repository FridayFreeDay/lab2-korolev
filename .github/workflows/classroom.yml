name: GitHub Classroom Workflow

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: "*/requirements-dev.txt"

      - name: Install dependencies
        run: |
          pip install \
            -r library-service/requirements-dev.txt \
            -r reservation-service/requirements-dev.txt \
            -r rating-service/requirements-dev.txt \
            -r gateway-service/requirements-dev.txt

      # Postgres поднимается из того же compose, что и весь стек: список баз
      # и права описаны один раз в postgres/scripts/db-v4.sql.
      - name: Start Postgres
        timeout-minutes: 3
        run: docker compose up -d --wait postgres

      # Тесты работают с базами *_test, поэтому данные, по которым позже
      # бежит newman, остаются нетронутыми.
      - name: Run unit tests
        timeout-minutes: 5
        run: |
          failed=""
          for entry in library-service:libraries \
                       reservation-service:reservations \
                       rating-service:ratings \
                       gateway-service:; do
            service="${entry%%:*}"
            database="${entry##*:}"
            if [ -n "${database}" ]; then
              export TEST_DATABASE_URL="postgresql+psycopg://program:test@localhost:5432/${database}_test"
            else
              unset TEST_DATABASE_URL
            fi
            echo "::group::pytest ${service}"
            (cd "${service}" && python -m pytest) || failed="${failed} ${service}"
            echo "::endgroup::"
          done
          if [ -n "${failed}" ]; then
            echo "::error::Unit-тесты упали:${failed}"
            exit 1
          fi

      - name: Build images
        timeout-minutes: 10
        run: docker compose build

      - name: Run containers
        timeout-minutes: 5
        run: |
          docker compose up -d
          bash ./scripts/wait-script.sh
        env:
          WAIT_PORTS: 8080,8070,8060,8050

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: v4/postman/collection.json
          environment: v4/postman/environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - name: Dump container logs
        if: failure()
        continue-on-error: true
        run: docker compose logs --no-color --tail 200

      - uses: education/autograding@v1
        id: autograder
        continue-on-error: true

      - name: Github auto grader mark
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{secrets.GOOGLE_API_KEY}}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
          homework_number: 2
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"

      - name: Stop containers
        if: always()
        continue-on-error: true
        run: docker compose down -v
