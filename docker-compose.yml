services:
  postgres:
    image: postgres:13
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  library-service:
    build: ./library-service
    container_name: library-service
    restart: on-failure
    environment:
      DATABASE_URL: "postgresql+psycopg://program:test@postgres:5432/libraries"
      PORT: "8060"
    ports:
      - "8060:8060"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8060/manage/health', timeout=2)" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  reservation-service:
    build: ./reservation-service
    container_name: reservation-service
    restart: on-failure
    environment:
      DATABASE_URL: "postgresql+psycopg://program:test@postgres:5432/reservations"
      PORT: "8070"
    ports:
      - "8070:8070"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8070/manage/health', timeout=2)" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rating-service:
    build: ./rating-service
    container_name: rating-service
    restart: on-failure
    environment:
      DATABASE_URL: "postgresql+psycopg://program:test@postgres:5432/ratings"
      PORT: "8050"
    ports:
      - "8050:8050"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8050/manage/health', timeout=2)" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    restart: on-failure
    environment:
      PORT: "8080"
      LIBRARY_SERVICE_URL: "http://library-service:8060"
      RESERVATION_SERVICE_URL: "http://reservation-service:8070"
      RATING_SERVICE_URL: "http://rating-service:8050"
    ports:
      - "8080:8080"
    depends_on:
      - library-service
      - reservation-service
      - rating-service
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/manage/health', timeout=2)" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db-data:
